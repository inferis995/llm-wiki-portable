<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>LLM Wiki</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" class="app">

  <!-- ───────────────────────── Sidebar ───────────────────────── -->
  <aside id="sidebar" class="sidebar">
    <header class="sidebar__head">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text">
          <b id="brand-title">LLM Wiki</b>
          <small id="brand-sub">knowledge base</small>
        </span>
      </div>
      <button class="icon-btn sidebar__close" data-action="toggle-sidebar" title="Chiudi" aria-label="Chiudi sidebar">
        <svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </header>

    <div class="sidebar__search">
      <button class="searchbar" data-action="palette">
        <svg viewBox="0 0 20 20" class="searchbar__icon"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5L18 18"/></svg>
        <span>Cerca…</span>
        <kbd>⌘K</kbd>
      </button>
    </div>

    <nav class="sidebar__nav" aria-label="Viste">
      <button class="navbtn" data-view="graph"    title="Grafo (g)"><svg viewBox="0 0 20 20"><circle cx="5" cy="6" r="2.2"/><circle cx="15" cy="5" r="2.2"/><circle cx="10" cy="15" r="2.2"/><path d="M6.6 7.4l2.2 5.9M13.5 6.6L11.3 13"/></svg><span>Grafo</span></button>
      <button class="navbtn" data-view="overview" title="Panoramica (o)"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6" rx="1.2"/><rect x="11" y="3" width="6" height="6" rx="1.2"/><rect x="3" y="11" width="6" height="6" rx="1.2"/><rect x="11" y="11" width="6" height="6" rx="1.2"/></svg><span>Panoramica</span></button>
      <button class="navbtn" data-view="activity" title="Attività (a)"><svg viewBox="0 0 20 20"><path d="M2 10h4l2.5-6 3 12 2.5-6h4"/></svg><span>Attività</span></button>
      <button class="navbtn" data-view="health"   title="Salute (h)"><svg viewBox="0 0 20 20"><path d="M10 17s-6-4-6-8a3.6 3.6 0 016-2.5A3.6 3.6 0 0116 9c0 4-6 8-6 8z"/></svg><span>Salute</span><span id="health-badge" class="badge"></span></button>
    </nav>

    <div id="tag-rail" class="tag-rail" aria-label="Filtro per tag"></div>

    <div id="page-tree" class="tree" role="tree"></div>

    <footer class="sidebar__foot">
      <span id="stat-pages">—</span>
      <span id="stat-links">—</span>
      <button class="icon-btn" data-action="theme" title="Tema chiaro/scuro (t)" aria-label="Cambia tema">
        <svg viewBox="0 0 20 20" class="ico-moon"><path d="M16 12.5A7 7 0 017.5 4 6.5 6.5 0 1016 12.5z"/></svg>
        <svg viewBox="0 0 20 20" class="ico-sun"><circle cx="10" cy="10" r="3.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.4 4.4l1.4 1.4M14.2 14.2l1.4 1.4M15.6 4.4l-1.4 1.4M5.8 14.2l-1.4 1.4"/></svg>
      </button>
    </footer>
  </aside>

  <!-- ────────────────────────── Main ─────────────────────────── -->
  <main class="main">

    <header class="topbar">
      <button class="icon-btn topbar__menu" data-action="toggle-sidebar" aria-label="Apri sidebar">
        <svg viewBox="0 0 20 20"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
      </button>

      <nav class="crumbs" id="crumbs" aria-label="Percorso"></nav>

      <div class="topbar__spacer"></div>

      <div class="graph-tools" id="graph-tools">
        <button class="chip" data-action="shape" title="Forma della galassia (m)">Forma</button>
        <button class="chip" data-action="labels" title="Nomi delle pagine (l)">Nomi</button>
        <button class="chip" data-action="flight" title="Volo (w)">Volo</button>
        <button class="chip" data-action="zen" title="Modalità zen (z)">Zen</button>
        <button class="icon-btn" data-action="fit" title="Inquadra tutto (0)" aria-label="Inquadra tutto">
          <svg viewBox="0 0 20 20"><path d="M3 7V3h4M17 7V3h-4M3 13v4h4M17 13v4h-4"/></svg>
        </button>
      </div>

      <button class="icon-btn" data-action="help" title="Scorciatoie (?)" aria-label="Scorciatoie">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M8 8a2 2 0 113 1.7c-.6.4-1 .8-1 1.6M10 14.2v.01"/></svg>
      </button>
    </header>

    <div class="stage">
      <!-- Grafo 3D -->
      <section id="view-graph" class="view view--graph is-active">
        <div id="graph-canvas" class="graph-canvas"></div>
        <div id="graph-legend" class="legend" aria-label="Categorie"></div>
        <div id="graph-hint" class="graph-hint"></div>
        <div id="node-card" class="node-card" hidden></div>
        <div id="sm-timeline" class="sm-timeline" hidden></div>
      </section>

      <!-- Pagina -->
      <section id="view-page" class="view view--page">
        <article class="doc">
          <header id="doc-head" class="doc__head"></header>
          <div class="doc__body">
            <div id="doc-content" class="prose"></div>
            <aside id="doc-aside" class="doc__aside"></aside>
          </div>
          <footer id="doc-foot" class="doc__foot"></footer>
        </article>
      </section>

      <!-- Risultati ricerca -->
      <section id="view-search" class="view view--panel">
        <div id="search-results" class="panel"></div>
      </section>

      <!-- Panoramica -->
      <section id="view-overview" class="view view--panel">
        <div id="overview" class="panel"></div>
      </section>

      <!-- Attività -->
      <section id="view-activity" class="view view--panel">
        <div id="activity" class="panel"></div>
      </section>

      <!-- Salute -->
      <section id="view-health" class="view view--panel">
        <div id="health" class="panel"></div>
      </section>
    </div>
  </main>
</div>

<!-- ─────────────────────── Command palette ─────────────────────── -->
<div id="palette" class="palette" hidden>
  <div class="palette__backdrop" data-action="palette-close"></div>
  <div class="palette__box" role="dialog" aria-modal="true" aria-label="Cerca ed esegui">
    <div class="palette__input">
      <svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5L18 18"/></svg>
      <input id="palette-input" type="text" placeholder="Cerca pagine, tag, azioni…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div id="palette-list" class="palette__list"></div>
    <div class="palette__foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> naviga</span>
      <span><kbd>↵</kbd> apri</span>
      <span><kbd>⇥</kbd> ricerca completa</span>
    </div>
  </div>
</div>

<!-- ───────────────────────── Shortcuts ─────────────────────────── -->
<div id="help" class="modal" hidden>
  <div class="modal__backdrop" data-action="help-close"></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-label="Scorciatoie">
    <header class="modal__head">
      <h2>Scorciatoie</h2>
      <button class="icon-btn" data-action="help-close" aria-label="Chiudi"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
    </header>
    <div class="modal__body" id="help-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="lib/marked.min.js"></script>
<script src="starmap.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
